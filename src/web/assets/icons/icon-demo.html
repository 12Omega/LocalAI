<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Set Demo - Desktop GUI Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 40px;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .theme-toggle {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        .theme-toggle button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle button:hover {
            background: #f0f0f0;
        }

        .theme-toggle button.active {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .icon-item:hover {
            background: #f9f9f9;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .icon-item img {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
        }

        .icon-name {
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .button-examples {
            margin-top: 40px;
        }

        .button-examples h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button.demo-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.demo-btn img {
            width: 20px;
            height: 20px;
        }

        button.demo-btn.primary {
            background: #4caf50;
            color: white;
        }

        button.demo-btn.primary:hover {
            background: #45a049;
        }

        button.demo-btn.danger {
            background: #f44336;
            color: white;
        }

        button.demo-btn.danger:hover {
            background: #da190b;
        }

        button.demo-btn.secondary {
            background: #2196F3;
            color: white;
        }

        button.demo-btn.secondary:hover {
            background: #0b7dda;
        }

        button.demo-btn.outline {
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
        }

        button.demo-btn.outline:hover {
            background: #f5f5f5;
        }

        /* Dark theme */
        body.dark {
            background: #1a1a1a;
            color: #e0e0e0;
        }

        body.dark .container {
            background: #2d2d2d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        body.dark h1,
        body.dark h2 {
            color: #e0e0e0;
        }

        body.dark .icon-item {
            border-color: #444;
        }

        body.dark .icon-item:hover {
            background: #383838;
        }

        body.dark .icon-name {
            color: #b0b0b0;
        }

        body.dark .theme-toggle button {
            background: #3d3d3d;
            border-color: #555;
            color: #e0e0e0;
        }

        body.dark .theme-toggle button:hover {
            background: #4a4a4a;
        }

        body.dark button.demo-btn.outline {
            border-color: #555;
            color: #e0e0e0;
        }

        body.dark button.demo-btn.outline:hover {
            background: #3d3d3d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Desktop GUI Application - Icon Set</h1>
        
        <div class="theme-toggle">
            <button onclick="setTheme('light')" class="active" id="light-btn">Light Theme</button>
            <button onclick="setTheme('dark')" id="dark-btn">Dark Theme</button>
        </div>

        <div class="icon-grid">
            <div class="icon-item">
                <img src="run.svg" alt="Run">
                <span class="icon-name">run.svg</span>
            </div>
            <div class="icon-item">
                <img src="stop.svg" alt="Stop">
                <span class="icon-name">stop.svg</span>
            </div>
            <div class="icon-item">
                <img src="settings.svg" alt="Settings">
                <span class="icon-name">settings.svg</span>
            </div>
            <div class="icon-item">
                <img src="history.svg" alt="History">
                <span class="icon-name">history.svg</span>
            </div>
            <div class="icon-item">
                <img src="clear.svg" alt="Clear">
                <span class="icon-name">clear.svg</span>
            </div>
            <div class="icon-item">
                <img src="copy.svg" alt="Copy">
                <span class="icon-name">copy.svg</span>
            </div>
            <div class="icon-item">
                <img src="export.svg" alt="Export">
                <span class="icon-name">export.svg</span>
            </div>
            <div class="icon-item">
                <img src="delete.svg" alt="Delete">
                <span class="icon-name">delete.svg</span>
            </div>
            <div class="icon-item">
                <img src="browse.svg" alt="Browse">
                <span class="icon-name">browse.svg</span>
            </div>
        </div>

        <div class="button-examples">
            <h2>Button Examples</h2>
            <div class="button-row">
                <button class="demo-btn primary">
                    <img src="run.svg" alt="">
                    Run Task
                </button>
                <button class="demo-btn danger">
                    <img src="stop.svg" alt="">
                    Stop Task
                </button>
                <button class="demo-btn secondary">
                    <img src="settings.svg" alt="">
                    Settings
                </button>
            </div>
            <div class="button-row">
                <button class="demo-btn outline">
                    <img src="history.svg" alt="">
                    History
                </button>
                <button class="demo-btn outline">
                    <img src="clear.svg" alt="">
                    Clear
                </button>
                <button class="demo-btn outline">
                    <img src="copy.svg" alt="">
                    Copy
                </button>
                <button class="demo-btn outline">
                    <img src="export.svg" alt="">
                    Export
                </button>
                <button class="demo-btn outline">
                    <img src="delete.svg" alt="">
                    Delete
                </button>
                <button class="demo-btn outline">
                    <img src="browse.svg" alt="">
                    Browse
                </button>
            </div>
        </div>
    </div>

    <script>
        function setTheme(theme) {
            document.body.className = theme === 'dark' ? 'dark' : '';
            document.getElementById('light-btn').classList.toggle('active', theme === 'light');
            document.getElementById('dark-btn').classList.toggle('active', theme === 'dark');
        }
    </script>
</body>
</html>
